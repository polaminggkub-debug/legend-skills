<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{HEADING}}</title>
<style>
:root{--bg:#fafaf9;--card:#fff;--ink:#1c1917;--mute:#78716c;--line:#e7e5e4;--hot:#fef08a;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--ink:#f5f5f4;--mute:#a8a29e;--line:#44403c;--hot:#713f12;--acc:#60a5fa}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
h1{font-size:22px}h2{font-size:17px;margin:0 0 8px}
audio{width:100%}ul{padding-left:18px;color:var(--mute);font-size:15px}li.hot{background:var(--hot);color:var(--ink);border-radius:4px}
.opts label{display:inline-block;margin:4px 12px 4px 0;cursor:pointer}
.note{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:220px}
.wide{width:100%;box-sizing:border-box}
#copy{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:16px;cursor:pointer}
#out{width:100%;height:120px;margin-top:8px;box-sizing:border-box}
</style></head><body><main>
<h1>{{HEADING}}</h1>
<p>{{INTRO}}</p>
{{CARDS}}
<section><input type="submit" id="copy" value="คัดลอกคำตอบ"><textarea id="out" readonly></textarea></section>
</main><script>
document.getElementById('copy').onclick=()=>{
  const r=[...document.querySelectorAll('.opts')].map(d=>{
    const c=d.querySelector('input[type=radio]:checked');
    return {q:d.dataset.q,time:d.dataset.t,was:d.dataset.was,answer:c?c.value:'',note:d.querySelector('.note').value.trim()};
  }).filter(x=>x.answer||x.note);
  const t=JSON.stringify(r,null,1);const o=document.getElementById('out');o.value=t;
  try{navigator.clipboard.writeText(t)}catch(e){o.select()}
};
</script></body></html>
